name: Publish APT Repository

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to publish'
        required: true
        type: string
      run_id:
        description: 'Build workflow run ID'
        required: true
        type: string

# Push the APT repo, create the release (contents) and download the build run's artifacts (actions)
permissions:
  actions: read
  contents: write

# Runs from main publish to apt.0x23.me as before; runs from any other branch go to apt.0x23.me/beta
# and a GitHub pre-release, so a test build never reaches the stable repo. Each repo keeps the
# newest build of every train (kernel series); publish-repo.sh reads APT_URL for that.
env:
  BETA: ${{ github.ref != 'refs/heads/main' }}
  PREFIX: ${{ github.ref == 'refs/heads/main' && '.' || 'beta' }}
  APT_URL: https://apt.0x23.me${{ github.ref != 'refs/heads/main' && '/beta' || '' }}

jobs:
  publish:
    runs-on: [self-hosted, t2-kernel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: kernel-packages-${{ inputs.kernel_version }}
          path: build-artifacts/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: List downloaded artifacts
        id: artifacts
        run: |
          echo "==> Downloaded artifacts:"
          find build-artifacts -name "*.deb" -type f
          echo "series=$(echo "${{ inputs.kernel_version }}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      # HOME in the job's temp dir: the signing key and the aptly db do not persist on the runner
      - name: Import GPG key
        env:
          HOME: ${{ runner.temp }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "==> Importing GPG key"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Publish repository
        env:
          HOME: ${{ runner.temp }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "==> Publishing repository"
          bash scripts/publish-repo.sh build-artifacts/ "$PREFIX"

      # apt.0x23.me (nginx on r-worker): the deploy key only allows rsync into its html directory
      - name: Upload to apt.0x23.me
        run: |
          rsync -rlt --delete --chmod=D755,F644 \
            -e "ssh -i /var/lib/apt-publish/id_ed25519 -o ControlMaster=no -o ControlPath=none" \
            docs/KEY.gpg docs/dists docs/pool "apt-publish@10.23.32.41:${PREFIX#.}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.kernel_version }}${{ env.BETA == 'true' && format('-beta.{0}', inputs.run_id) || '' }}
          name: ${{ env.BETA == 'true' && 'Beta' || 'Release' }} ${{ inputs.kernel_version }}
          body: |
            ## Proxmox VE Kernel with T2 Mac Support

            **Kernel Version:** ${{ inputs.kernel_version }}

            ### Installation

            Add the APT repository:
            ```bash
            echo "deb [signed-by=/usr/share/keyrings/ppe-pve-t2.asc] ${{ env.APT_URL }} trixie main" | sudo tee /etc/apt/sources.list.d/ppe-pve-t2.list
            wget -qO /usr/share/keyrings/ppe-pve-t2.asc ${{ env.APT_URL }}/KEY.gpg
            sudo apt update
            sudo apt install proxmox-kernel-t2-${{ steps.artifacts.outputs.series }} proxmox-headers-t2-${{ steps.artifacts.outputs.series }}
            ```

            ### What's Included

            - Proxmox VE kernel with T2 Mac hardware support
            - Touch Bar support
            - BCE (Buffer Copy Engine) support
            - Bluetooth support
            - APFS filesystem support

            ### Files

            All packages are also available in the APT repository.
          files: build-artifacts/*.deb
          draft: false
          prerelease: ${{ env.BETA == 'true' }}
          make_latest: ${{ env.BETA != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
