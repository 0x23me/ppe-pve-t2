name: Check Upstream Versions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; dispatching build.yml needs actions: write
permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: [self-hosted, t2-kernel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # One check per train (kernel series) in versions.json; a failed check doesn't stop the others
      - name: Check for new versions
        id: check
        run: |
          builds='[]'
          failed=0
          for series in $(jq -r '.trains | keys[]' versions.json); do
            if result=$(bash scripts/check-versions.sh "$series"); then
              echo "$result" | jq .
              builds=$(jq -c --argjson r "$result" '. + [$r | select(.needs_build == "true")]' <<<"$builds")
            else
              echo "::error::Version check for ${series} failed"
              failed=1
            fi
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          exit $failed

      - name: Trigger builds
        if: ${{ !cancelled() && steps.check.outputs.builds != '[]' && steps.check.outputs.builds != '' }}
        uses: actions/github-script@v9
        env:
          BUILDS: ${{ steps.check.outputs.builds }}
        with:
          script: |
            for (const b of JSON.parse(process.env.BUILDS)) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',
                ref: 'main',
                inputs: {
                  pve_kernel_tag: b.pve_kernel_tag,
                  t2linux_commit: b.t2linux_commit
                }
              });
              console.log(`Triggered build of ${b.series}: ${b.pve_kernel_tag}`);
            }

      - name: No build needed
        if: steps.check.outputs.builds == '[]'
        run: echo "No new versions detected, skipping build"
