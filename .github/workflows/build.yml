name: Build PVE Kernel with T2 Support

on:
  workflow_dispatch:
    inputs:
      pve_kernel_tag:
        description: 'Proxmox kernel release (e.g. proxmox-kernel-7.0.14-30 or proxmox/7.3.5-1)'
        required: true
        type: string
      t2linux_commit:
        description: 'T2Linux patches commit hash'
        required: true
        type: string

# Push versions.json (contents) and dispatch publish.yml (actions)
permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: [self-hosted, t2-kernel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker
        run: |
          echo "==> Docker version"
          docker --version

      # Self-hosted runner: the deps image and the source/ccache volume persist between runs
      - name: Build kernel in Docker
        run: |
          make build-docker \
            PVE_KERNEL_TAG="${{ inputs.pve_kernel_tag }}" \
            T2LINUX_COMMIT="${{ inputs.t2linux_commit }}"

      - name: Find built packages
        id: packages
        run: |
          echo "==> Locating built packages"

          # Packages should be in the root directory after Docker build
          DEB_FILES=$(find . -maxdepth 2 -name "*.deb" -type f)

          if [ -z "$DEB_FILES" ]; then
            echo "Error: No .deb files found!"
            exit 1
          fi

          echo "Found packages:"
          echo "$DEB_FILES"

          # Extract kernel version from one of the package names
          # Example: proxmox-kernel-6.17.4-2-pve-t2_6.17.4-2_amd64.deb → 6.17.4-2-pve-t2
          KERNEL_VERSION=$(echo "$DEB_FILES" | grep -oE 'proxmox-kernel-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-pve-t2_' | head -1 | sed 's/^proxmox-kernel-//; s/_$//')

          if [ -z "$KERNEL_VERSION" ]; then
            echo "Warning: Could not extract kernel version, using tag"
            KERNEL_VERSION="${{ inputs.pve_kernel_tag }}"
          fi

          echo "Kernel version: $KERNEL_VERSION"
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-packages-${{ steps.packages.outputs.kernel_version }}
          path: |
            *.deb
            pve-kernel/*.deb
          retention-days: 30

      # The build container writes as root; hand the workspace back so the next checkout can clean it
      - name: Fix workspace ownership
        if: always()
        run: docker run --rm -v "$PWD:/repo" debian:trixie chown -R "$(id -u):$(id -g)" /repo

      # Branch builds are betas; versions.json tracks main's builds only, one entry per train
      # (kernel series). Other trains' builds may have pushed since this run started, so update
      # the branch as it is now rather than the commit this run checked out.
      - name: Update versions.json
        if: github.ref == 'refs/heads/main'
        run: |
          echo "==> Updating versions.json"
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -f -B "$GITHUB_REF_NAME" FETCH_HEAD

          # Read t2linux KVER from the build
          T2_KVER="unknown"
          if [ -d linux-t2-patches ]; then
            T2_KVER=$(cat linux-t2-patches/version 2>/dev/null || echo "unknown")
          fi

          KERNEL_VERSION="${{ steps.packages.outputs.kernel_version }}"
          jq --arg series "$(echo "$KERNEL_VERSION" | cut -d. -f1,2)" \
             --arg pve_tag "${{ inputs.pve_kernel_tag }}" \
             --arg t2_commit "${{ inputs.t2linux_commit }}" \
             --arg t2_kver "$T2_KVER" \
             --arg kernel_ver "$KERNEL_VERSION" \
             --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.trains[$series].last_build = {
               pve_kernel_tag: $pve_tag,
               t2linux_commit: $t2_commit,
               t2linux_kver: $t2_kver,
               kernel_version: $kernel_ver,
               built_at: $built_at,
               status: "success"
             } | .history += [{
               pve_kernel_tag: $pve_tag,
               t2linux_commit: $t2_commit,
               kernel_version: $kernel_ver,
               built_at: $built_at
             }]' versions.json > versions.json.tmp

          mv versions.json.tmp versions.json
          cat versions.json | jq .

      - name: Commit versions.json
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update versions.json: ${{ inputs.pve_kernel_tag }}" || echo "No changes to commit"
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "No changes to push"

      # Publish from the same branch: main publishes the stable repo, any other branch the beta one
      - name: Trigger publish workflow
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: '${{ github.ref_name }}',
              inputs: {
                kernel_version: '${{ steps.packages.outputs.kernel_version }}',
                run_id: '${{ github.run_id }}'
              }
            });
            console.log('Triggered publish workflow');
